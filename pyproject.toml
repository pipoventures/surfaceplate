# Surfaceplate — packaging and dependency declaration.
#
# `[project.dependencies]` exists to satisfy the `dependency_lock` control this repository
# declares. Until it existed, that declaration was an overclaim: all three workflows ran
# `pip install pyyaml jsonschema` unpinned, and `--quiet` suppressed pip's resolution output, so a
# green CI run could not tell you which `jsonschema` had validated the schemas. Recorded as F21.
#
# `[build-system]` and `[tool.hatch.build]` arrived at `ACT-019` (item 1 of org/RELEASE_PLAN.md).
# `DR-10` flagged, and left unsolved, that `install_standard.py`'s file-location mechanism does
# not survive pip distribution: it resolved directories that sit outside any importable package.
# `ACT-019` moved the payload into `surfaceplate/` itself, so the package IS the payload — see
# `org/decisions/DR-31.md` for the layout decision and what it does and does not solve.
#
# `[project.scripts]` arrived at `ACT-020` (item 2). `pip install surfaceplate` now gives a real
# `surfaceplate` command — `install` and `check` work immediately; `adopt` (the interactive
# wizard) needs the `adopt` extra: `pip install surfaceplate[adopt]`. See `org/decisions/DR-32.md`
# for why the wizard's dependency is an extra rather than a hard one — the short version is that
# `.github/workflows/standards-conformance.yml`, the workflow this project INSTALLS into every
# adopting repository, never runs `adopt`; it only ever runs the checker. Putting it
# in `[project.dependencies]` would put it on every adopter's CI pip-install line for a command
# their CI never invokes. That reasoning survived `DR-36` replacing the dependency itself, and
# matters more now, not less: `textual` carries a larger transitive set than `questionary` did.

[project]
name = "surfaceplate"
version = "0.16.0"
description = "A governance framework that installs into a repository and checks it against the standard it publishes."
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Pipo Ventures Ltd" }]
# `DR-61`: the name is reserved on PyPI before 1.0, and the index says so beside it. The
# classifier moves to Production/Stable only with the release that item 10 authorises.
classifiers = ["Development Status :: 3 - Alpha"]

# Exact pins, deliberately. `>=` would reintroduce the exposure this file closes: a breaking
# release would reach every adopting repository at once, with no record of which version worked.
#
# Honest limit: pinning a version is not pinning an artefact. These have no hashes, so this
# protects against an unexpected NEW release, not against a compromised re-upload of the same
# version. PyPI does not permit re-uploading a version, which makes that largely theoretical, but
# it is a weaker guarantee than a hash-bearing lock and is stated rather than implied.
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

# `textual` (ACT-027, DR-36) drives the `adopt` wizard's full-screen interface, and only that —
# `install` and `check` never import it, neither at module scope nor otherwise: `surfaceplate/adopt/
# tui/` is imported only inside `cli.py`'s `adopt` subcommand, which also preflights the import so
# a missing extra produces one clear sentence rather than a traceback. It is an extra rather than a
# hard dependency for exactly that reason — see the note above `[project]`. Resolved in a clean
# virtual environment, all suites run against the result before pinning (`F21`'s discipline).
#
# It REPLACES `questionary==2.1.1`, which `DR-32` chose and `DR-36` retired. That replacement is a
# mandatory stop under `.github/skills/dependency-update/SKILL.md` (a dependency fixed by a decision
# record) and proceeded on a recorded human decision, not an agent's judgement. Cost, stated rather
# than buried: `textual` brings seven transitive packages (`rich`, `markdown-it-py`,
# `mdit-py-plugins`, `mdurl`, `linkify-it-py`, `platformdirs`, `pygments`) where `questionary`
# brought two. That is a real increase, and it lands only on someone who installs the extra.
[project.optional-dependencies]
adopt = ["textual==8.2.8"]
# `DR-50` (4): the snapshot suite's runner and plugin, and the plugin's own exact `syrupy` pin.
# Test-only, so an extra: no adopter's CI installs these. Reviewed under the dependency-update
# skill in `ACT-046`: pytest 8.4.2 (MIT), pytest-textual-snapshot 1.1.0 (MIT), syrupy 4.8.0
# (Apache-2.0); `pip check` clean against the pinned `textual`.
test = ["pytest==8.4.2", "pytest-textual-snapshot==1.1.0", "syrupy==4.8.0"]

[project.scripts]
surfaceplate = "surfaceplate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under surfaceplate/ ships, code and data alike - hatchling's default behaviour for
# a named package directory. There is nothing to enumerate here, deliberately: DR-6 already
# governs this project's stance on maintaining a second list that could drift from the one thing
# it is meant to describe, and the acceptance test in DR-31 asserts the built wheel's contents
# directly rather than trusting this file's intent.
packages = ["surfaceplate"]

[tool.hatch.build.targets.sdist]
include = ["surfaceplate/", "pyproject.toml", "README.md", "LICENSE", "LICENSE-DOCS", "NOTICE"]
