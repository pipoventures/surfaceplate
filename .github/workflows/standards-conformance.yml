name: Standards conformance

# Installed by Surfaceplate. Do not edit this file: it is
# covered by the integrity check and local changes will fail the build. Raise
# changes against the surfaceplate repository instead.

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --quiet --disable-pip-version-check pyyaml jsonschema

      - name: Check conformance to Surfaceplate
        run: python .standards/check_conformance.py --repo .
