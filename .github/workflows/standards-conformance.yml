name: Standards conformance

# Installed by Surfaceplate. Do not edit this file: it is
# covered by the integrity check and local changes will fail the build. Raise
# changes against the surfaceplate repository instead.

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history. The default is a depth-1 clone, and the prerequisite-gate history
          # audit would then examine one commit and report nothing wrong - a negative result
          # from a look that could not have found anything. See F31.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.26.0

      # `--currency` (DR-72, closing F124) makes ONE request, to pypi.org, and reports whether
      # the standard installed here is the published one. It is advisory: it can never fail
      # this check, because pinning a version deliberately is a legitimate decision and a gate
      # that failed on it would say otherwise. It runs here and nowhere else - the pre-commit
      # hook and a local `surfaceplate check` stay entirely offline.
      #
      # To decline the call, declare it in YOUR OWN profile, which is the file here that is
      # yours to edit:
      #
      #   adoption:
      #     currency_check:
      #       enabled: false
      #       rationale: <why - an egress-restricted runner, or a deliberate pin>
      #
      # Nothing is then sent, and the check says currency was not established rather than that
      # it passed.
      - name: Check conformance to Surfaceplate
        run: python .standards/check_conformance.py --repo . --currency
