name: Secret scan

# Blocking on newly-introduced secrets. A finding in the commits a push or PR adds fails
# this job. Registered as ACT-005; the control that requires it is decided in DR-18.
#
# Scope is deliberately the pushed range, not all of history. History here is immutable
# (no force-push), so failing a build over a historical finding blocks work that cannot fix
# it — the remedy for a leaked credential is rotation, not a red build — while every
# historical false positive becomes a permanent build-breaker. What the control actually
# requires is that no secret ENTERS, and entry happens at the tip.
#
# WHERE THIS DELIBERATELY DIFFERS from the same workflow in plyego, hermes and plutos: those
# check out mnemosyne for a shared gitleaks config, using a repository secret. This one uses
# gitleaks' own rules and depends on nothing outside this repository. Surfaceplate is meant to
# be read and copied by people with no access to that config, and a framework whose own
# security workflow cannot run in the reader's checkout is a poor demonstration of itself. The
# cost is real and stated: this repository does not inherit the portfolio's tuned rule set.
#
# The history sweep those repositories also carry is NOT copied here. It is scheduled, and
# schedules in this account are unreliable rather than broken: measured on Monday 2026-08-31,
# five workflows were due at 06:00 UTC under `0 6 * * 1` and exactly one fired, six hours late
# (mnemosyne#ACT-056). A trigger that fires for roughly one in five due runs cannot bound a
# detection interval, so a sweep described as weekly would be an appearance, not a control.
#
# gitleaks is fetched at run time rather than pinned: a scanner benefits from current detection
# rules the way a build dependency benefits from a frozen version. There is nothing here a
# stale pin would protect.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, added so a FULL-history sweep can be run on demand. The range step below
  # finds neither a pull-request base nor `github.event.before` on a dispatch, so it falls to
  # its full-scan fallback - which is the safe direction it was already written to take. This
  # repository ships no scheduled sweep (see the note above), so without a manual trigger there
  # was no way to scan history at all.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Capture the full response before parsing it rather than piping curl into a
          # filter. A filter that stops reading after its first match closes the pipe early
          # and sends curl a SIGPIPE mid-write, which curl reports as exit 23 — a real bug
          # this pattern shipped with elsewhere, not a shape to reintroduce.
          #
          # The API call is authenticated: unauthenticated api.github.com is limited to 60
          # requests/hour per IP, shared across Actions runners, and has returned 403 here
          # intermittently. The asset download below is deliberately NOT authenticated — it
          # redirects to objects.githubusercontent.com, and a forwarded Authorization header
          # breaks that request.
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest)"
          latest="$(printf '%s' "$release_json" | jq -r '.tag_name')"
          version="${latest#v}"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${latest}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Determine the commit range to scan
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Where the range cannot be determined — a new branch, a force push, a rewritten
          # base — the fallback is a FULL scan. That is deliberately the safe direction:
          # scan more, never less.
          base=""
          if [ -n "${PR_BASE:-}" ]; then
            base="$PR_BASE"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "log_opts=--log-opts=${base}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "scope=incremental (${base}..${HEAD_SHA})" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "scope=full history (range undeterminable - new branch, force push, or unreachable base)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks (blocking - exit code reaches the job)
        run: |
          echo "Scan scope: ${{ steps.range.outputs.scope }}"
          ./gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1 \
            --verbose \
            ${{ steps.range.outputs.log_opts }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Summarise findings
        if: always()
        run: |
          # A report this step cannot read must NOT be reported as a clean scan. An earlier
          # form of this step elsewhere ended in `|| echo 0`, so an absent or unparseable
          # report printed "no findings" — and did, in a run where gitleaks printed
          # "leaks found: 4". Absence of evidence is reported as absence of evidence.
          if [ ! -f gitleaks-report.json ]; then
            echo "::warning::The report is absent. This step establishes NOTHING about whether findings exist."
            exit 0
          fi
          if ! count="$(python3 -c "import json; print(len(json.load(open('gitleaks-report.json'))))")"; then
            echo "::warning::The report could not be parsed. This step establishes NOTHING about whether findings exist."
            exit 0
          fi
          if [ "$count" -gt 0 ]; then
            echo "::error::$count finding(s) in the scanned range - this job fails. See the uploaded artifact. If a finding is a false positive, triage it into .gitleaksignore by FINGERPRINT, never by path, which would also mute future real secrets in that file. If it is real: rotate the credential first - this repository's history is not rewritten, so deleting the line does not remove the exposure."
          else
            echo "Report read successfully, 0 entries, in ${{ steps.range.outputs.scope }}."
          fi
