schema_version: "1.0"
method_id: METHOD-SEASONALITY-001
method_version: "2.3.0"
method_kind: deterministic_method
name: Regional seasonality factor
intended_use: >-
  Applies a fitted per-region seasonality multiplier to a demand baseline, for forecasts
  that reach a published operational plan.
owner: Named Owner
lifecycle_status: active
validation_status: passed
approval_status: approved
implementation_revision: 9f2c1ab
input_contracts:
  - contract/demand-baseline@3
  - contract/seasonality-parameters@2
output_contracts:
  - contract/adjusted-demand@3
data_dependencies:
  - dataset/demand-history
  - dataset/seasonality-parameters
configuration_dependencies:
  - config/forecast-horizon
assumptions:
  - Regional demand seasonality is stable across the fitted window.
  - The prior-year baseline is free of duplicated records.
limitations:
  - >-
    Not fitted for regions with fewer than eight quarters of history; those fall back to the
    national factor, which is a different method.
  - >-
    The second assumption above is the one that failed in practice - see the override record,
    which exists because a duplicated baseline reached the fit.
revalidation_trigger: >-
  Refit, a change to the parameter contract, or any data-quality defect found in the fitted
  window.
