$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:pipo-ventures:surfaceplate:0.7.0:gate-exception.schema.yaml
title: Prerequisite Gate Exception
description: >-
  A permanent, attributable record that specific commits crossed a prerequisite gate without
  its precondition in place. A control with no legitimate escape route gets bypassed
  illegitimately instead, so this is the legitimate route - and it leaves a mark. An exception
  clears exactly the commits it names and nothing else. An accumulation of these records is a
  finding in its own right: it means the gate is wrongly scoped, or the process is wrong.
type: object
additionalProperties: false
required: [gate_id, commits, owner, rationale]
properties:
  gate_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9_]*$"
    description: The gate this exception applies to, as declared in the application profile.
  commits:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[0-9a-fA-F]{7,40}$"
      description: A full or abbreviated commit SHA.
    description: >-
      The specific commits excused. A blanket exception is not expressible here, and that is
      deliberate.
  owner:
    type: string
    minLength: 1
    description: The named human accountable for this exception. Not a team alias.
  rationale:
    type: string
    minLength: 1
    description: >-
      Why the gate was crossed, and what was done instead. "We were in a hurry" is a rationale;
      it is simply a poor one, and it will read as such at review.
  raised_on:
    type: string
    format: date
  remediation:
    type: string
    minLength: 1
    description: What was done afterwards to restore the intended state.
  decision_record_id:
    type: string
    description: A decision record, where the exception warranted one.
